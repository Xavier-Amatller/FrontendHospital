<div style="height: 90vh" class="container mt-5">
  <div class="card-header">
    <h2 class="card-title">User Profile</h2>
  </div>
  <div class="card-body">
    <form class="user-info mb-3">
      <div class="form-group">
        <label for="name"><strong>Name:</strong></label>
        <input type="text" class="form-control" id="name" name="name" />
      </div>
      <div class="form-group">
        <label for="email"><strong>Email:</strong></label>
        <input type="email" class="form-control" id="email" name="email" />
      </div>
      <div class="form-group">
        <label for="username"><strong>Username:</strong></label>
        <input type="text" class="form-control" id="username" name="username" />
      </div>
    </form>
    <div class="profile-actions d-flex gap-4">
      <button class="btn btn-warning mr-2" (click)="onEdit()">
        Apply Changes
      </button>
      <button class="btn btn-danger" (click)="onDelete()" routerLink="">
        Delete Profile
      </button>
    </div>
  </div>
</div>
