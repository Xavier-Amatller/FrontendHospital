<div style="height: 80vh" class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <form (ngSubmit)="login()" #loginForm="ngForm" class="mt-5">
        <h2 class="text-center">Login</h2>
        <div class="form-group">
          <label for="email">Email address</label>
          <input
            type="email"
            class="form-control"
            id="email"
            [(ngModel)]="email"
            name="email"
            required
            email
            #emailRef="ngModel"
          />
          <div *ngIf="emailRef.invalid && emailRef.touched" class="text-danger">
            <small *ngIf="emailRef.errors?.['required']">Email is required.</small>
            <small *ngIf="emailRef.errors?.['email']">Invalid email format.</small>
          </div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            [(ngModel)]="password"
            name="password"
            required
            minlength="8"
            pattern="^(?=.*[A-Za-z])(?=.*\d).{8,}$"
            #passwordRef="ngModel"
          />
          <div *ngIf="passwordRef.invalid && passwordRef.touched" class="text-danger">
            <small *ngIf="passwordRef.errors?.['required']">Password is required.</small>
            <small *ngIf="passwordRef.errors?.['minlength']">Password must be at least 8 characters.</small>
            <small *ngIf="passwordRef.errors?.['pattern']">
              Password must contain at least one letter and one number.
            </small>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block mt-4" [disabled]="loginForm.invalid">
          Login
        </button>
        <div class="btn btn-success btn-block mt-4" routerLink="/nurse/register" style="color: white;">
          Register?
        </div>
      </form>
    </div>
  </div>
</div>
