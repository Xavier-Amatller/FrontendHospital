<div style="height: 80vh" class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div>
        <form (ngSubmit)="login()" class="mt-5">
          <h2 class="text-center">Login</h2>
          <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" class="form-control" id="email" [(ngModel)]="email" name="email" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" class="form-control" id="password" [(ngModel)]="password" name="password" required />
          </div>
          <button type="submit" class="btn btn-primary btn-block mt-4">
            Login
          </button>
          <div class="btn btn-success btn-block mt-4" routerLink="/nurse/register" style="color: white;">
            Register?
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
