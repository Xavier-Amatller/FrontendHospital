<div style="height: 80vh" class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div>
          <form (ngSubmit)="login()" class="mt-5">
            <h2 class="text-center">Register</h2>
            <div class="form-group">
                <label for="name">Name</label>
                <input
                  type="name"
                  class="form-control"
                  id="name"
                  [(ngModel)]="name"
                  name="name"
                  required
                />
              </div>            <div class="form-group">
                <label for="surname">Surname</label>
                <input
                  type="surname"
                  class="form-control"
                  id="surname"
                  [(ngModel)]="surname"
                  name="surname"
                  required
                />
              </div>
            <div class="form-group">
              <label for="email">Email address</label>
              <input
                type="email"
                class="form-control"
                id="email"
                [(ngModel)]="email"
                name="email"
                required
              />
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                [(ngModel)]="password"
                name="password"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary btn-block mt-4">
              Register
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
