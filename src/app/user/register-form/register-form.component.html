<div style="height: 80vh" class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <form (ngSubmit)="register()" #registerForm="ngForm" class="mt-5">
        <h2 class="text-center">Register</h2>
        <div class="form-group">
          <label for="name">Name</label>
          <input
            type="text"
            class="form-control"
            id="name"
            [(ngModel)]="name"
            name="name"
            required
            minlength="2"
            #nameRef="ngModel"
          />
          <div *ngIf="nameRef.invalid && nameRef.touched" class="text-danger">
            <small *ngIf="nameRef.errors?.['required']">Name is required.</small>
            <small *ngIf="nameRef.errors?.['minlength']">Name must be at least 2 characters.</small>
          </div>
        </div>
        <div class="form-group">
          <label for="surname">Surname</label>
          <input
            type="text"
            class="form-control"
            id="surname"
            [(ngModel)]="surname"
            name="surname"
            required
            minlength="2"
            #surnameRef="ngModel"
          />
          <div *ngIf="surnameRef.invalid && surnameRef.touched" class="text-danger">
            <small *ngIf="surnameRef.errors?.['required']">Surname is required.</small>
            <small *ngIf="surnameRef.errors?.['minlength']">Surname must be at least 2 characters.</small>
          </div>
        </div>
        <div class="form-group">
          <label for="email">Email address</label>
          <input
            type="email"
            class="form-control"
            id="email"
            [(ngModel)]="email"
            name="email"
            required
            email
            #emailRef="ngModel"
          />
          <div *ngIf="emailRef.invalid && emailRef.touched" class="text-danger">
            <small *ngIf="emailRef.errors?.['required']">Email is required.</small>
            <small *ngIf="emailRef.errors?.['email']">Invalid email format.</small>
          </div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            [(ngModel)]="password"
            name="password"
            required
            minlength="8"
            pattern="^(?=.*[A-Za-z])(?=.*\d).{8,}$"
            #passwordRef="ngModel"
          />
          <div *ngIf="passwordRef.invalid && passwordRef.touched" class="text-danger">
            <small *ngIf="passwordRef.errors?.['required']">Password is required.</small>
            <small *ngIf="passwordRef.errors?.['minlength']">Password must be at least 8 characters.</small>
            <small *ngIf="passwordRef.errors?.['pattern']">
              Password must contain at least one letter and one number.
            </small>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block mt-4" [disabled]="registerForm.invalid">
          Register
        </button>
      </form>
    </div>
  </div>
</div>
