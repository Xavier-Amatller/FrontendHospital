<header style="height: auto;">
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarTogglerDemo01"
        aria-controls="navbarTogglerDemo01"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
        <a class="navbar-brand" routerLink="">El Hospital...</a>
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" routerLink="dashboard">Dashboard</a>
          </li>
        </ul>
        <div>
          <div *ngIf="!isLogged()">
            <button id="sessionBtn" class="btn btn-outline-success" type="button" routerLink="nurse/login">Log In</button>
          </div>
          <div *ngIf="isLogged()">
            <div class="d-flex gap-4">
              <button (click)="closeSession()" id="sessionBtn" class="btn btn-outline-success" type="button" routerLink="nurse/login">Log out</button>
              <button id="profileBtn" class="btn btn-outline-primary" type="button" routerLink="nurse/profile">
                <img src="#" alt="Profile" style="width: 30px; height: 30px; border-radius: 50%;" />
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>
</header>
